<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Battle Line ONLINE</title><link rel="stylesheet" href="style.css"></head><body>
<div id="toast"></div>
<section id="title" class="screen active"><header><h1>BATTLE LINE <small>ONLINE</small></h1><b>v0.5.0</b></header><div class="namebox"><label>プレイヤー名</label><input id="name" maxlength="32" autocomplete="off"></div><div id="rooms" class="room-grid"></div><p class="hint">2人専用 / 戦術カードONが標準</p></section>
<section id="lobby" class="screen"><header><h1>BATTLE LINE</h1><b>v0.5.0</b></header><div class="panel"><h2 id="lobbyRoom">ROOM</h2><div id="seats"></div><div id="hostSettings" class="lobby-settings">
<div class="setting-card"><div class="setting-title"><b>戦術カード</b></div><div class="segmented" data-setting-ui="tactics"><button data-value="true">あり</button><button data-value="false">なし</button></div><select id="tactics" class="setting-native" aria-hidden="true"><option value="true">あり</option><option value="false">なし</option></select></div>
<div class="setting-card"><div class="setting-title"><b>フラッグ獲得</b></div><div class="segmented" data-setting-ui="claimRule"><button data-value="normal">通常</button><button data-value="advanced">上級</button></div><select id="claimRule" class="setting-native" aria-hidden="true"><option value="normal">通常</option><option value="advanced">上級（ターン開始時のみ）</option></select></div>
<div class="setting-card"><div class="setting-title"><b>先攻</b></div><div class="segmented three" data-setting-ui="first"><button data-value="random">ランダム</button><button data-value="host">ホスト</button><button data-value="guest">ゲスト</button></div><select id="first" class="setting-native" aria-hidden="true"><option value="random">ランダム</option><option value="host">ホスト</option><option value="guest">ゲスト</option></select></div>
<div class="setting-card"><div class="setting-title"><b>CPU</b></div><div class="segmented four" data-setting-ui="cpu"><button data-value="0">なし</button><button data-value="1">Lv1</button><button data-value="2">Lv2</button><button data-value="3">Lv3</button></div><select id="cpu" class="setting-native" aria-hidden="true"><option value="0">なし</option><option value="1">Lv1</option><option value="2">Lv2</option><option value="3">Lv3</option></select></div>
</div><div class="actions"><button id="startBtn" class="primary">ゲーム開始</button><button id="leaveBtn">退出</button></div></div></section>
<section id="game" class="screen"><header class="game-head"><div id="oppInfo"></div><span id="phaseText" class="hidden"></span><div class="game-tools"><button id="rulesBtn">ルール・用語</button><button id="historyBtn">ログ</button><button id="gameLeaveBtn">退室</button></div></header><nav id="flagNav"></nav><div id="battleScroller"><div id="battlefield"></div></div><div id="turnGuide" class="turn-guide"></div><div id="drawArea"><button id="troopDeck">部隊 <b></b></button><button id="tacticDeck">戦術 <b></b></button></div><div id="myInfo"></div><div id="hand"></div><div id="finishedActions" class="finished-actions hidden"><button id="reopenResultBtn">リザルトを開く</button><button id="returnLobbyBtn" class="primary">ロビーへ戻る</button></div></section>
<div id="modal" class="modal hidden"><div class="modal-card"><button id="modalClose" class="x">×</button><div id="modalBody"></div></div></div>
<script src="config.js"></script><script src="app.js"></script></body></html>
