<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Battle Line ONLINE</title><link rel="stylesheet" href="style.css"></head><body>
<div id="toast"></div>
<section id="title" class="screen active"><header><h1>BATTLE LINE <small>ONLINE</small></h1><b>v0.3</b></header><div class="namebox"><label>プレイヤー名</label><input id="name" maxlength="32" autocomplete="off"></div><div id="rooms" class="room-grid"></div><p class="hint">2人専用 / 戦術カードONが標準</p></section>
<section id="lobby" class="screen"><header><h1>BATTLE LINE</h1><b>v0.3</b></header><div class="panel"><h2 id="lobbyRoom">ROOM</h2><div id="seats"></div><div id="hostSettings"><label>戦術カード <select id="tactics"><option value="true">あり</option><option value="false">なし</option></select></label><label>フラッグ獲得 <select id="claimRule"><option value="normal">通常</option><option value="advanced">上級（ターン開始時のみ）</option></select></label><label>先攻 <select id="first"><option value="random">ランダム</option><option value="host">ホスト</option><option value="guest">ゲスト</option></select></label><label>CPU <select id="cpu"><option value="0">なし</option><option value="1">Lv1</option><option value="2">Lv2</option><option value="3">Lv3</option></select></label></div><div class="actions"><button id="startBtn" class="primary">ゲーム開始</button><button id="leaveBtn">退出</button></div></div></section>
<section id="game" class="screen"><header class="game-head"><div id="oppInfo"></div><div><strong>BATTLE LINE</strong><span id="phaseText"></span></div><div class="game-tools"><button id="historyBtn">ログ</button><button id="rulesBtn">ルール・用語</button><button id="gameLeaveBtn">退室</button></div></header><nav id="flagNav"></nav><div id="battleScroller"><div id="battlefield"></div></div><div id="turnGuide" class="turn-guide"></div><div id="drawArea"><button id="troopDeck">部隊 <b></b></button><button id="tacticDeck">戦術 <b></b></button></div><div id="myInfo"></div><div id="hand"></div><div id="finishedActions" class="finished-actions hidden"><button id="reopenResultBtn">リザルトを開く</button><button id="returnLobbyBtn" class="primary">ロビーへ戻る</button></div></section>
<div id="modal" class="modal hidden"><div class="modal-card"><button id="modalClose" class="x">×</button><div id="modalBody"></div></div></div>
<script src="config.js"></script><script src="app.js"></script></body></html>
